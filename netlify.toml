[build]
  publish = "."
  command = ""

# ============================================================================
# LINKS DE LOS PDFs QUE YA ESTÁN EN MANOS DE LOS INVERSORES
# ============================================================================
# Los reportes que se le mandan a cada inversor llevan links con esta forma:
#
#   https://www.tangoholding.com/_files/ugd/405a64_<archivo>.pdf
#
# Es la URL pública que Wix le daba a los archivos cuando el dominio estaba
# conectado. Los archivos siguen alojados en el file hosting de Wix, así que
# esta regla manda cada pedido al lugar donde el PDF vive hoy.
#
# NO BORRAR. Sin esto, todos los links de los reportes ya enviados dan 404.
#
# Si algún día los PDFs se mudan a otro lado (Netlify, Cloudflare R2, etc.),
# alcanza con cambiar la dirección de "to" — los links de los inversores
# siguen funcionando igual, porque apuntan a tangoholding.com.
[[redirects]]
  from = "/_files/ugd/*"
  to = "https://6737a04c-ebe9-4353-a225-ee5c8d4c83da.filesusr.com/ugd/:splat"
  status = 302

# Wix también servía archivos con esta otra forma, más vieja.
[[redirects]]
  from = "/ugd/*"
  to = "https://6737a04c-ebe9-4353-a225-ee5c8d4c83da.filesusr.com/ugd/:splat"
  status = 302

# Y las imágenes y documentos servidos desde /_files/
[[redirects]]
  from = "/_files/*"
  to = "https://6737a04c-ebe9-4353-a225-ee5c8d4c83da.filesusr.com/:splat"
  status = 302

# --- Redirecciones heredadas del sitio en Wix -------------------------------
# El sitio de Wix usaba ?lang=en para el inglés.
[[redirects]]
  from = "/"
  to = "/en/"
  status = 301
  force = true
  query = { lang = "en" }

[[redirects]]
  from = "/"
  to = "/"
  status = 200
  force = true
  query = { lang = "es" }

# --- Cabeceras -------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Área de reportes para inversores: accesible por link directo, fuera de Google.
[[headers]]
  for = "/reportes*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/juankeser*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"

# PDFs de reportes alojados en el sitio: fuera de Google, caché larga.
[[headers]]
  for = "/reportes/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
