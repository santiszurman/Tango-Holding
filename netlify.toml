[build]
  publish = "."
  command = ""

# --- Redirecciones heredadas del sitio en Wix -------------------------------
# El sitio de Wix usaba ?lang=en para el inglés.
[[redirects]]
  from = "/"
  to = "/en/"
  status = 301
  force = true
  query = { lang = "en" }

[[redirects]]
  from = "/"
  to = "/"
  status = 200
  force = true
  query = { lang = "es" }

# --- Cabeceras -------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Área de reportes para inversores: accesible por link directo, fuera de Google.
[[headers]]
  for = "/reportes*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/juankeser*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
